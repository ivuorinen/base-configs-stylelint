---
name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

# NPM_TOKEN is deliberately NOT set at workflow level: that would put the
# publish credential in the environment of the lint and test jobs, which run
# third-party actions and `npm install`. It is scoped to the publish step only.

jobs:
  Linter:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      statuses: write # to update commit statuses
      contents: read # to check out the repository
      packages: read # to read packages

    steps:
      - name: Run PR Lint
        # https://github.com/ivuorinen/actions
        uses: ivuorinen/actions/pr-lint@94a4f68a6b95ecc1677fbcac1683119fd869adf7 # v2026.07.04

  Test:
    name: Smoke Test
    # See pr-lint.yml: the caller's `permissions: {}` has to be widened here or
    # the called workflow's `contents: read` exceeds its grant and the run fails
    # at startup.
    permissions:
      contents: read # to check out the repository
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - Linter
      - Test
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          always-auth: true
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          scope: "@ivuorinen"

      - name: Install and enable corepack
        shell: sh
        # Version pinned so the toolchain is reproducible, and --ignore-scripts
        # so nothing in the install tree executes. Renovate has no manager for
        # versions inside `run:`, so bump this by hand when corepack releases.
        run: npm install -g corepack@0.35.0 --ignore-scripts --force && corepack enable

      - name: Cache Node Modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install Dependencies
        shell: bash
        # Runs unconditionally, including on a cache hit. It used to be gated on
        # `cache-hit != 'true'`, which voided the guarantee below in exactly the
        # case it is written for: the cache key is the yarn.lock hash, so a
        # package.json-only dependency bump kept the key, restored the previous
        # node_modules, skipped this step, and released against a dependency tree
        # that no longer matched the manifest. That shipped 1.4.0 -- semantic
        # -release read @ivuorinen/semantic-release-config 1.2.1's rules from the
        # stale cache and cut a minor where 2.0.0's rules say major.
        #
        # --immutable installs exactly what yarn.lock resolves and fails if the
        # lockfile would change, so a release can never silently pull a version
        # nobody reviewed. That check is worthless when skipped, and cheap when
        # not: against a restored node_modules it relinks rather than refetches.
        # It also makes a desynced lockfile fail the release outright, which is
        # why the cache key does not need package.json in it -- the install
        # reconciles node_modules to the lockfile whatever the cache restored.
        #
        # --mode=skip-build is the Yarn v2+ equivalent of --ignore-scripts;
        # .yarnrc.yml sets enableScripts: false too, but state it on the command
        # as well so the guarantee is visible at the call site.
        run: yarn install --immutable --mode=skip-build

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
