nodeLinker: node-modules

# Dependencies may not run install scripts. This is already Yarn 4's default
# (`yarn config --why enableScripts` reports Source: <default>, Value: false),
# but a security-relevant behaviour should be declared rather than inherited —
# a future default flip would otherwise silently re-enable arbitrary code
# execution at install time.
enableScripts: false

# First-party @ivuorinen packages are exempt from the npmMinimalAgeGate
# supply-chain check, so freshly released config packages can be consumed
# immediately. The age gate still applies to all third-party packages.
npmPreapprovedPackages:
  - '@ivuorinen/*'

# Resolve no third-party version until it has been on the registry for three
# days, the window the shared Renovate preset waits (minimumReleaseAge). Yarn 4
# already gates at one day by default; declared for the same reason as
# enableScripts above, so a future default change cannot silently remove the
# guard.
npmMinimalAgeGate: 3d
